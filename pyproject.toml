[project]
name = "orderpilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django~=5.2.0",
    "django-axes>=8.3.1",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-simple-history>=3.13.0",
    "psycopg[binary]>=3.3.5",
    "rules>=3.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]
