<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 275" width="880" height="275" role="img" aria-labelledby="t">
<title id="t">补货建议计算流程</title>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#5b636e}
.mt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.c{text-anchor:middle}
.bg{fill:#fff;stroke:#e3e5e8}
.box{fill:#f5f7fa;stroke:#c5ccd6;stroke-width:1.2}
.pri{fill:#eaf1fd;stroke:#1d5fd1;stroke-width:1.4}
.ok{fill:#e8f6ee;stroke:#2f9e5a;stroke-width:1.4}
.ln{fill:none;stroke:#6b7480;stroke-width:1.5}
.ah{fill:#6b7480}
@media (prefers-color-scheme:dark){
text{fill:#e6e8eb}.s{fill:#9aa3ae}
.bg{fill:#161a20;stroke:#2a3039}.box{fill:#1d232b;stroke:#3a4350}
.pri{fill:#1a2638;stroke:#6ea2ff}.ok{fill:#15291e;stroke:#4cc27a}
.ln{stroke:#8a94a0}.ah{fill:#8a94a0}
}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="274" rx="10"/>

<!-- 输入 -->
<rect class="box" x="10" y="20" width="230" height="48" rx="8"/>
<text class="mt" x="24" y="41">SalesSnapshot</text>
<text class="s" x="24" y="59">门店 × 商品 × 周期的销量</text>

<rect class="box" x="10" y="84" width="230" height="48" rx="8"/>
<text class="mt" x="24" y="105">InventorySnapshot</text>
<text class="s" x="24" y="123">仓库 × 商品 × 日期的库存</text>

<rect class="box" x="10" y="148" width="230" height="48" rx="8"/>
<text class="t" x="24" y="169">在途量</text>
<text class="s" x="24" y="187">已下单、未到货的采购单</text>

<rect class="box" x="10" y="212" width="230" height="48" rx="8"/>
<text class="mt" x="24" y="233">SupplierProduct</text>
<text class="s" x="24" y="251">生产周期 · 最小起订量 · 箱规</text>

<path class="ln" d="M240,44 H270 M240,108 H270 M240,172 H270 M240,236 H270 M270,44 V236"/>
<path class="ln" d="M270,140 H296" marker-end="url(#a)"/>

<!-- 策略 → 建议 → 采购单 -->
<rect class="pri" x="300" y="104" width="180" height="72" rx="8"/>
<text class="mt c" x="390" y="134">ReplenishmentStrategy</text>
<text class="s c" x="390" y="155">注册表 · 可按客户替换</text>

<path class="ln" d="M480,140 H506" marker-end="url(#a)"/>

<rect class="pri" x="510" y="104" width="190" height="72" rx="8"/>
<text class="mt c" x="605" y="134">ReplenishmentSuggestion</text>
<text class="s c" x="605" y="155">建议量 · 计算依据 · 断货日</text>

<path class="ln" d="M700,140 H756" marker-end="url(#a)"/>
<text class="s c" x="728" y="130">人工确认</text>

<rect class="ok" x="760" y="104" width="110" height="72" rx="8"/>
<text class="mt c" x="815" y="134">PurchaseOrder</text>
<text class="s c" x="815" y="155">采购单</text>

<!-- 默认公式 -->
<rect class="box" x="300" y="200" width="570" height="60" rx="8"/>
<text class="s" x="314" y="224">默认策略：建议量 = 日均销量 × (生产周期 + 海运周期 + 安全天数) − 可用库存 − 在途量</text>
<text class="s" x="314" y="246">再按最小起订量和箱规取整；每条建议都保存计算依据；不自动下单。</text>
</svg>
