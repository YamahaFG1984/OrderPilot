<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 245" width="880" height="245" role="img" aria-labelledby="t">
<title id="t">采购单标准状态机</title>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#5b636e}
.c{text-anchor:middle}
.bg{fill:#fff;stroke:#e3e5e8}
.box{fill:#f5f7fa;stroke:#c5ccd6;stroke-width:1.2}
.pri{fill:#eaf1fd;stroke:#1d5fd1;stroke-width:1.4}
.ok{fill:#e8f6ee;stroke:#2f9e5a;stroke-width:1.6}
.ln{fill:none;stroke:#6b7480;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.ah{fill:#6b7480}
@media (prefers-color-scheme:dark){
text{fill:#e6e8eb}.s{fill:#9aa3ae}
.bg{fill:#161a20;stroke:#2a3039}.box{fill:#1d232b;stroke:#3a4350}
.pri{fill:#1a2638;stroke:#6ea2ff}.ok{fill:#15291e;stroke:#4cc27a}
.ln{stroke:#8a94a0}.ah{fill:#8a94a0}
}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="244" rx="10"/>

<!-- 退回：待供应商确认 → 草稿 -->
<path class="ln" d="M192,80 C192,36 56,36 56,76" marker-end="url(#a)"/>
<text class="s c" x="124" y="36">拒绝 / 改期</text>

<!-- 主流程箭头 -->
<path class="ln" d="M102,102 H130" marker-end="url(#a)"/>
<text class="s c" x="118" y="92">提交</text>
<path class="ln" d="M250,102 H278" marker-end="url(#a)"/>
<text class="s c" x="266" y="92">确认</text>
<path class="ln" d="M374,102 H402" marker-end="url(#a)"/>
<path class="ln" d="M498,102 H526" marker-end="url(#a)"/>
<path class="ln" d="M622,102 H650" marker-end="url(#a)"/>
<path class="ln" d="M746,102 H774" marker-end="url(#a)"/>

<!-- 状态 -->
<rect class="pri" x="10" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="56" y="107">草稿</text>
<rect class="pri" x="134" y="80" width="116" height="44" rx="22"/>
<text class="t c" x="192" y="107">待供应商确认</text>
<rect class="pri" x="282" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="328" y="107">生产中</text>
<rect class="pri" x="406" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="452" y="107">待验货</text>
<rect class="pri" x="530" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="576" y="107">待出货</text>
<rect class="pri" x="654" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="700" y="107">已出货</text>
<rect class="ok" x="778" y="80" width="92" height="44" rx="22"/>
<text class="t c" x="824" y="107">已结算</text>

<!-- 取消 -->
<path class="ln dash" d="M56,124 V146 M192,124 V146 M328,124 V146 M452,124 V146 M576,124 V146 M56,146 H576"/>
<path class="ln dash" d="M376,146 V174" marker-end="url(#a)"/>
<text class="s" x="390" y="166">出货前任意阶段可取消</text>
<rect class="box" x="330" y="178" width="92" height="40" rx="20" style="stroke-dasharray:5 4"/>
<text class="t c" x="376" y="203">取消</text>

<text class="s" x="870" y="236" text-anchor="end">状态和转换由核心定义，扩展只能注册钩子</text>
</svg>
