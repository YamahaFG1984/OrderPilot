<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 250" width="890" height="250" role="img" aria-labelledby="t">
<title id="t">单据流转</title>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}
.s{font-size:12px;fill:#5b636e}
.b{font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c{text-anchor:middle}
.bg{fill:#fff;stroke:#e3e5e8}
.box{fill:#f5f7fa;stroke:#c5ccd6;stroke-width:1.2}
.pri{fill:#eaf1fd;stroke:#1d5fd1;stroke-width:1.4}
.ln{fill:none;stroke:#6b7480;stroke-width:1.5}
.ah{fill:#6b7480}
@media (prefers-color-scheme:dark){
text{fill:#e6e8eb}.s{fill:#9aa3ae}
.bg{fill:#161a20;stroke:#2a3039}.box{fill:#1d232b;stroke:#3a4350}
.pri{fill:#1a2638;stroke:#6ea2ff}
.ln{stroke:#8a94a0}.ah{fill:#8a94a0}
}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="889" height="249" rx="10"/>

<!-- 卡片：客户订单 -->
<rect class="box" x="10" y="30" width="180" height="196" rx="8"/>
<path class="pri" d="M10,86 V38 a8,8 0 0 1 8,-8 H182 a8,8 0 0 1 8,8 V86 Z"/>
<text class="t c" x="100" y="55">客户订单</text>
<text class="s mono c" x="100" y="75">SalesOrder</text>
<text class="b" x="24" y="114">• 首单 / 翻单</text>
<text class="b" x="24" y="140">• 客户交期</text>
<text class="b" x="24" y="166">• 来源：ERP 或客户文件</text>

<!-- 卡片：采购单 -->
<rect class="box" x="240" y="30" width="180" height="196" rx="8"/>
<path class="pri" d="M240,86 V38 a8,8 0 0 1 8,-8 H412 a8,8 0 0 1 8,8 V86 Z"/>
<text class="t c" x="330" y="55">采购单</text>
<text class="s mono c" x="330" y="75">PurchaseOrder</text>
<text class="b" x="254" y="114">• 承诺交期 / 确认交期</text>
<text class="b" x="254" y="140">• 生产节点 Milestone</text>
<text class="b" x="254" y="166">• 交期变更历史</text>
<text class="b" x="254" y="192">• 供应商门户确认</text>

<!-- 卡片：出货 -->
<rect class="box" x="470" y="30" width="180" height="196" rx="8"/>
<path class="pri" d="M470,86 V38 a8,8 0 0 1 8,-8 H642 a8,8 0 0 1 8,8 V86 Z"/>
<text class="t c" x="560" y="55">出货</text>
<text class="s mono c" x="560" y="75">Shipment</text>
<text class="b" x="484" y="114">• 出货确认</text>
<text class="b" x="484" y="140">• 报关资料</text>
<text class="b" x="484" y="166">• 物流单号</text>
<text class="b" x="484" y="192">• 附件归档</text>

<!-- 卡片：结算 -->
<rect class="box" x="700" y="30" width="180" height="196" rx="8"/>
<path class="pri" d="M700,86 V38 a8,8 0 0 1 8,-8 H872 a8,8 0 0 1 8,8 V86 Z"/>
<text class="t c" x="790" y="55">结算</text>
<text class="s mono c" x="790" y="75">finance</text>
<text class="b" x="714" y="114">• SupplierInvoice 发票</text>
<text class="b" x="714" y="140">• Payment 货款</text>
<text class="b" x="714" y="166">• Penalty 罚款</text>

<path class="ln" d="M190,58 H236" marker-end="url(#a)"/>
<text class="s c" x="215" y="48" style="font-size:11px">拆分</text>
<text class="s c" x="215" y="76" style="font-size:11px">合并</text>
<path class="ln" d="M420,58 H466" marker-end="url(#a)"/>
<path class="ln" d="M650,58 H696" marker-end="url(#a)"/>
</svg>
