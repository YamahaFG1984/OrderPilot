<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t">
<title id="t">通知分发流程</title>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#5b636e}
.mt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.c{text-anchor:middle}
.bg{fill:#fff;stroke:#e3e5e8}
.box{fill:#f5f7fa;stroke:#c5ccd6;stroke-width:1.2}
.pri{fill:#eaf1fd;stroke:#1d5fd1;stroke-width:1.4}
.ln{fill:none;stroke:#6b7480;stroke-width:1.5}
.ah{fill:#6b7480}
@media (prefers-color-scheme:dark){
text{fill:#e6e8eb}.s{fill:#9aa3ae}
.bg{fill:#161a20;stroke:#2a3039}.box{fill:#1d232b;stroke:#3a4350}
.pri{fill:#1a2638;stroke:#6ea2ff}
.ln{stroke:#8a94a0}.ah{fill:#8a94a0}
}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="819" height="399" rx="10"/>

<rect class="box" x="190" y="20" width="180" height="48" rx="8"/>
<text class="t c" x="280" y="40">业务事件</text>
<text class="s c" x="280" y="58">领域事件订阅</text>

<rect class="box" x="450" y="20" width="180" height="48" rx="8"/>
<text class="t c" x="540" y="40">预警</text>
<text class="s c" x="540" y="58">Alert 首次触发</text>

<path class="ln" d="M280,68 L368,107" marker-end="url(#a)"/>
<path class="ln" d="M540,68 L452,107" marker-end="url(#a)"/>

<rect class="pri" x="260" y="110" width="300" height="56" rx="8"/>
<text class="mt c" x="410" y="134">Notification</text>
<text class="s c" x="410" y="154">收件人 · 类型 · 标题 · 正文 · 关联对象</text>

<path class="ln" d="M410,166 V196" marker-end="url(#a)"/>

<rect class="pri" x="260" y="200" width="300" height="56" rx="8"/>
<text class="t c" x="410" y="224">分发器</text>
<text class="s c" x="410" y="244">按订阅偏好路由 · Celery notify 队列</text>

<path class="ln" d="M410,256 V278 M125,278 H695"/>
<path class="ln" d="M125,278 V296" marker-end="url(#a)"/>
<path class="ln" d="M315,278 V296" marker-end="url(#a)"/>
<path class="ln" d="M505,278 V296" marker-end="url(#a)"/>
<path class="ln" d="M695,278 V296" marker-end="url(#a)"/>

<rect class="box" x="40" y="300" width="170" height="52" rx="8"/>
<text class="t c" x="125" y="322">站内信</text>
<text class="s c" x="125" y="341">HTMX 定时轮询</text>

<rect class="box" x="230" y="300" width="170" height="52" rx="8"/>
<text class="t c" x="315" y="322">邮件</text>
<text class="s c" x="315" y="341">SMTP</text>

<rect class="box" x="420" y="300" width="170" height="52" rx="8"/>
<text class="t c" x="505" y="322">企业微信</text>
<text class="s c" x="505" y="341">群机器人 webhook</text>

<rect class="box" x="610" y="300" width="170" height="52" rx="8"/>
<text class="t c" x="695" y="322">钉钉 / 飞书</text>
<text class="s c" x="695" y="341">群机器人 webhook</text>

<text class="s" x="40" y="382">渠道是可插拔的 Channel 类，扩展可以新增；用户可按通知类型选择渠道，并支持每日汇总。</text>
</svg>
