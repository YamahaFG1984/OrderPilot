<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375" role="img" aria-labelledby="t">
<title id="t">单个客户实例的部署结构</title>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;fill:#5b636e}
.mt{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600}
.c{text-anchor:middle}
.bg{fill:#fff;stroke:#e3e5e8}
.box{fill:#f5f7fa;stroke:#c5ccd6;stroke-width:1.2}
.pri{fill:#eaf1fd;stroke:#1d5fd1;stroke-width:1.4}
.ok{fill:#e8f6ee;stroke:#2f9e5a;stroke-width:1.4}
.ext{fill:#fff4e5;stroke:#d9822b;stroke-width:1.4}
.ln{fill:none;stroke:#6b7480;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.grp{fill:none;stroke:#9aa3ae;stroke-width:1.2;stroke-dasharray:6 5}
.ah{fill:#6b7480}
@media (prefers-color-scheme:dark){
text{fill:#e6e8eb}.s{fill:#9aa3ae}
.bg{fill:#161a20;stroke:#2a3039}.box{fill:#1d232b;stroke:#3a4350}
.pri{fill:#1a2638;stroke:#6ea2ff}.ok{fill:#15291e;stroke:#4cc27a}.ext{fill:#2d2113;stroke:#e0a060}
.ln{stroke:#8a94a0}.grp{stroke:#5b636e}.ah{fill:#8a94a0}
}
</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="879" height="374" rx="10"/>

<rect class="grp" x="150" y="20" width="560" height="340" rx="10"/>
<text class="s" x="166" y="42">客户实例 · docker-compose（每家客户一套）</text>

<!-- 第一层：入口 -->
<rect class="box" x="10" y="66" width="120" height="50" rx="8"/>
<text class="t c" x="70" y="88">浏览器</text>
<text class="s c" x="70" y="106">员工 · 供应商</text>

<rect class="box" x="180" y="66" width="120" height="50" rx="8"/>
<text class="mt c" x="240" y="88">nginx</text>
<text class="s c" x="240" y="106">HTTPS · 静态文件</text>

<rect class="pri" x="340" y="66" width="180" height="50" rx="8"/>
<text class="mt c" x="430" y="88">web</text>
<text class="s c" x="430" y="106">Django · gunicorn</text>

<path class="ln" d="M130,91 H176" marker-end="url(#a)"/>
<path class="ln" d="M300,91 H336" marker-end="url(#a)"/>

<!-- 第二层：数据 -->
<path class="ln" d="M380,116 V172" marker-end="url(#a)"/>
<path class="ln" d="M480,116 V172" marker-end="url(#a)"/>

<rect class="ok" x="250" y="176" width="170" height="50" rx="8"/>
<text class="mt c" x="335" y="198">PostgreSQL</text>
<text class="s c" x="335" y="216">业务数据 · 每日备份</text>

<rect class="ok" x="460" y="176" width="170" height="50" rx="8"/>
<text class="mt c" x="545" y="198">Redis</text>
<text class="s c" x="545" y="216">任务队列 · 缓存</text>

<!-- 第三层：后台任务 -->
<path class="ln" d="M255,286 V258 M430,286 V258 M610,286 V258 M255,258 H610"/>
<path class="ln" d="M335,258 V230" marker-end="url(#a)"/>
<path class="ln" d="M545,258 V230" marker-end="url(#a)"/>

<rect class="pri" x="180" y="286" width="150" height="50" rx="8"/>
<text class="mt c" x="255" y="308">celery-beat</text>
<text class="s c" x="255" y="326">定时调度</text>

<rect class="pri" x="350" y="286" width="160" height="50" rx="8"/>
<text class="mt c" x="430" y="308">celery-worker</text>
<text class="s c" x="430" y="326">队列 default · notify</text>

<rect class="pri" x="530" y="286" width="160" height="50" rx="8"/>
<text class="mt c" x="610" y="308">celery-worker</text>
<text class="s c" x="610" y="326">队列 sync</text>

<!-- 外部 ERP -->
<path class="ln dash" d="M690,311 H736" marker-end="url(#a)"/>
<text class="s c" x="714" y="302">同步</text>
<rect class="ext" x="740" y="286" width="130" height="50" rx="8"/>
<text class="t c" x="805" y="308">金蝶云星空</text>
<text class="s c" x="805" y="326">WebAPI</text>
</svg>
